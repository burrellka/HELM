[project]
name = "kblocallm"
# Bump this and everything downstream follows: /healthz, /version, the UI
# header, and the image tag in infra/docker-compose.production.yml. The
# container reports its OWN version rather than reading an env var, so
# "which image is actually running" is always answerable (URSA 1.1.3).
# Keep this in step with the compose image tags.
version = "0.9.10"
description = "HELM — AI fleet control plane over Lemonade Server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Auth: HS256 JWTs + Argon2id password hashing. Same stack as URSA.
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7.4",
    # Multipart form parsing, for the advisor knowledge-file upload endpoint.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the advisor's default instructions + knowledge file (the architect's
# canonical 14d and Advisor instructions.txt) inside the wheel, so a fresh
# container has them as editable defaults. They are seeds, not locks — the
# operator overrides both from the UI.
[tool.setuptools.package-data]
"kblocallm.advisor_data" = ["*.txt", "*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
