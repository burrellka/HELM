# HELM web container — serves the React SPA and proxies /api to the backend.
#
# Two of the blocks below exist because of real production incidents; do not
# trim them.

# ── The resolver trick ──────────────────────────────────────────────────────
# Without this, nginx resolves `helm-api` ONCE at config load and caches the
# IP forever. Restart the api container, it gets a new IP on the Docker network,
# and nginx keeps proxying to the old one — 502s that "fix themselves" when you
# restart the web container, which sends everyone hunting in the wrong place.
# The `map` + variable in proxy_pass forces runtime DNS resolution instead.
resolver 127.0.0.11 valid=30s ipv6=off;
map "" $helm_api_upstream { default "helm-api"; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — /models, /settings etc. are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # NOTE: proxy_pass via the variable (see resolver above). Because it's
        # a variable, nginx does NOT rewrite the URI — $uri passes through
        # verbatim, which is what we want. Don't add a path suffix here.
        proxy_pass http://$helm_api_upstream:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ── Load-bearing ───────────────────────────────────────────────────
        # The backend keys the session cookie's Secure flag off this (see
        # auth/routes.py::_detect_scheme). Drop it and either the cookie is
        # non-Secure in production, or login silently fails. It has an
        # Origin/Referer fallback, but don't rely on the fallback.
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Streaming: the log tail (spec §5.6) and streaming pulls ────────
        # nginx buffers responses by default, which means the stream never
        # flushes and the UI shows nothing until it dies. Then Cloudflare
        # 524s it at ~100s of silence. Both are invisible in local dev and
        # only appear once you're behind the real ingress.
        #
        # This block fixes the container-side nginx. NPM has its OWN nginx in
        # front and needs the same settings pasted into its per-host Custom
        # Nginx Configuration box — see infra/npm-mtls-ingress.md.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;        # chunked transfer needs 1.1
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        # A model load takes 10-20s (spec §5.3) and a pull takes minutes.
        # nginx's default proxy_read_timeout is 60s, which would kill both.
        # This is the BETWEEN-BYTES gap, not the total.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Open healthcheck — useful for an external monitor to confirm the api is
    # reachable through the web container, not just that nginx is up.
    location = /healthz {
        proxy_pass http://$helm_api_upstream:8000;
        proxy_set_header Host $host;
    }

    # Vite content-hashes these, so they're safe to cache hard.
    location ~* \.(?:js|css|woff2?|svg|ico|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached — it's the file that points at the hashed
    # bundle. Cache it and a browser can run an entire stale app from disk
    # after a deploy without ever asking the server. (We just watched this
    # exact confusion play out on a URSA release.)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}
